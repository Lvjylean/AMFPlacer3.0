<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMF3 · 器件与历史设计</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101722;color:#e8eef7;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}.panel{padding:18px 22px 12px;border-bottom:1px solid #344052;background:#141e2b}.top{display:flex;align-items:center;gap:15px;margin-bottom:15px}.brand{font-size:18px;font-weight:700}.muted{color:#9eafc5;font-size:12px}.top button{margin-left:auto}.fields{display:grid;grid-template-columns:220px minmax(320px,1fr) auto;gap:16px;align-items:end}.field{display:flex;flex-direction:column;gap:7px}label{font-weight:600;color:#c6d7ed}.step{color:#6ba9ef;margin-right:6px}select,button,input{font:inherit;border:1px solid #51647d;border-radius:6px;background:#213147;color:#edf4ff;padding:9px 11px}select{min-width:0;width:100%}button{cursor:pointer;white-space:nowrap}button.primary{background:#2561a7;border-color:#4084d4}button:disabled,select:disabled{opacity:.45;cursor:default}button:hover:enabled{filter:brightness(1.14)}.filters{display:flex;align-items:center;gap:12px;margin-top:12px}.filters input[type=search]{width:285px;padding:6px 10px}.filters label{font-size:12px;font-weight:400}a{color:#90caff}.info{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:#c3d0df;font-size:12px}.artifacts{margin-top:12px;border-top:1px solid #334157;padding-top:10px}.dcp-row{display:flex;align-items:center;gap:10px}.dcp-row select{width:min(360px,60vw)}.path{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#101722;padding:9px;border-radius:5px;color:#bbd7ed;margin-top:7px;font:12px ui-monospace,monospace}.note{margin-top:7px;color:#a9b7c9;font-size:12px}details.record{margin-top:10px}details.record summary{color:#9fc4f2;cursor:pointer;font-size:12px}details.record[open] summary{margin-bottom:8px}.status{padding:10px 22px;color:#b9cbe0;margin:0;min-height:38px}.error{color:#ffbb93}iframe{flex:1;min-height:300px;width:100%;border:0;background:#101722}[hidden]{display:none!important}@media(max-width:800px){.fields{grid-template-columns:140px minmax(0,1fr);gap:10px}.fields>button{grid-column:1/-1;padding:7px}.filters{flex-wrap:wrap;gap:8px}.filters input[type=search]{width:185px}.top{flex-wrap:wrap;gap:8px;margin-bottom:12px}.brand{font-size:15px}.top button{padding:6px}.panel{padding:12px}.dcp-row{flex-wrap:wrap}.dcp-row label{white-space:nowrap}.status{padding:8px 12px;font-size:12px}.field label{font-size:12px}iframe{min-height:340px}}
</style></head><body>
<section class="panel"><div class="top"><span class="brand">AMF3 · 历史设计</span><span class="muted" id="summary">正在读取目录…</span><button id="refresh">刷新历史目录</button></div>
<div class="fields"><div class="field"><label for="devices"><span class="step">01</span>器件</label><select id="devices"><option value="">请选择器件</option></select></div><div class="field"><label for="versions"><span class="step">02</span>历史设计 / DCP</label><select id="versions" disabled><option value="">请先选择器件</option></select></div><button id="load" class="primary" disabled>打开布局过程</button></div>
<div class="note">099 历史实验与已关联的 072 检查点；文件保留原位置。</div>
<div class="filters"><input type="search" id="search" aria-label="搜索历史记录" placeholder="按实验名搜索" disabled><label><input type="checkbox" id="playable" disabled> 只显示有布局轨迹的记录</label><span class="muted" id="count"></span><a id="open" hidden target="_blank" rel="noopener">独立打开</a></div>
<details class="record" id="recordDetails" hidden><summary id="recordSummary">检查点与器件信息</summary><div id="info" class="info" hidden></div><div id="artifacts" class="artifacts" hidden><div class="dcp-row"><label for="dcps">检查点</label><select id="dcps"></select><button id="copy">复制服务器路径</button><span id="dcpMeta" class="muted"></span></div><code id="path" class="path"></code><div class="note" id="dcpNote"></div></div>
</details></section><p id="status" class="status" role="status">请先选择器件，再选择历史设计。尚未加载布局数据。</p><iframe id="viewer" title="AMF3 placement viewer" src="about:blank" allow="fullscreen"></iframe>
<script>
let config,selected=null,busy=false;const $=id=>document.getElementById(id),device=$('devices'),versions=$('versions'),status=$('status');
const deviceName=d=>d==='UNCLASSIFIED'?'待核对器件':d;
function clearView(){ $('viewer').src='about:blank';$('open').hidden=true; }
function clearSelection(){selected=null;clearView();$('load').disabled=true;$('artifacts').hidden=true;$('info').hidden=true;$('recordDetails').hidden=true;}
function option(value,text){const o=document.createElement('option');o.value=value;o.textContent=text;return o;}
function showStatus(text,error=false){status.textContent=text;status.classList.toggle('error',error);}
function install(data){config=data;device.replaceChildren(option('','请选择器件'));const groups=new Map();for(const r of data.runs){const d=r.device||'UNCLASSIFIED';groups.set(d,(groups.get(d)||0)+1)}for(const [d,n] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){device.append(option(d,`${deviceName(d)} · ${n} 条历史记录`))}device.value='';$('summary').textContent=`${groups.size} 类器件 · ${data.runs.length} 条记录 · ${data.runs.reduce((n,r)=>n+(r.artifacts||[]).length,0)} 份 DCP`;changeDevice();}
function changeDevice(){clearSelection();$('search').value='';$('search').disabled=!device.value;$('playable').disabled=!device.value;filterRuns();showStatus(device.value?`已选择 ${deviceName(device.value)}，请选择历史设计。`:'请先选择器件，再选择历史设计。尚未加载布局数据。');}
function filterRuns(){clearSelection();versions.replaceChildren(option('',device.value?'请选择历史设计 / DCP':'请先选择器件'));versions.disabled=!device.value;if(!device.value){$('count').textContent='';return}const query=$('search').value.toLowerCase();const rows=config.runs.filter(r=>(r.device||'UNCLASSIFIED')===device.value && r.name.toLowerCase().includes(query) && (!$('playable').checked||r.frames>0));for(const r of rows){const n=(r.artifacts||[]).length;versions.append(option(r.run,`${r.name} | ${r.frames?`${r.frames} 帧`:'无布局轨迹'} | ${n?`${n} 份 DCP`:'暂无 DCP'}`))}$('count').textContent=`${rows.length} 条匹配记录`;}
function selectRun(){clearSelection();selected=config.runs.find(r=>r.run===versions.value && (r.device||'UNCLASSIFIED')===device.value)||null;if(!selected)return;const r=selected;$('info').hidden=false;$('info').replaceChildren();for(const text of [`器件：${deviceName(r.device)}`,`型号：${r.part||'未记录'}`,`记录状态：${r.state}`,`分类依据：${r.classification_source}`]){const span=document.createElement('span');span.textContent=text;$('info').append(span)}const ready=r.frames>0&&!r.classification_warning;$('load').disabled=!ready;const dcps=r.artifacts||[];$('recordDetails').hidden=false;$('recordDetails').open=!ready;$('recordSummary').textContent=`检查点与器件信息 · ${dcps.length} 份 DCP`;$('artifacts').hidden=false;$('dcps').replaceChildren();$('dcps').disabled=!dcps.length;$('copy').disabled=!dcps.length;if(dcps.length){dcps.forEach((d,i)=>$('dcps').append(option(String(i),`${d.name} · ${d.host==='eda072'?'072':'099'}`)));showDcp()}else{$('dcps').append(option('','暂无 DCP'));$('path').textContent='此记录未发现输出 DCP。';$('dcpMeta').textContent='';$('dcpNote').textContent='已有布局轨迹仍可单独查看；运行结束状态不等于 DCP 验收通过。'}showStatus(r.classification_warning|| (ready?`已选择 ${r.name}。点击“打开布局过程”加载 ${r.frames} 帧。`:'此记录只有 DCP，没有可播放的 AMF 轨迹；可查看并复制服务器路径。'),!!r.classification_warning);}
function showDcp(){const d=selected?.artifacts?.[Number($('dcps').value)];if(!d)return;$('path').textContent=`${d.host}:${d.path}`;$('dcpMeta').textContent=`${(d.bytes/1048576).toFixed(1)} MiB · ${d.part||'型号未确认'}`;$('dcpNote').textContent='DCP 留在服务器。布局过程展示 AMF 轨迹，不是读取该 DCP 的布线后画面。'+(d.error?' 元数据读取失败：'+d.error:'');}
function lock(value){busy=value;device.disabled=value;versions.disabled=value||!device.value;$('search').disabled=value||!device.value;$('playable').disabled=value||!device.value;$('refresh').disabled=value;$('load').disabled=value||!selected?.frames||!!selected?.classification_warning;}
async function load(){if(busy||!selected?.frames)return;const r=selected;lock(true);clearView();showStatus('正在连接并核对所选设计…');try{const response=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json','X-AMF-Token':config.token},body:JSON.stringify({run:r.run,device:device.value})});const result=await response.json();if(!response.ok)throw Error(result.error);$('viewer').src=result.url;$('open').href=result.url;$('open').hidden=false;showStatus(`已核对设计：${deviceName(r.device)} / ${result.name} · ${result.frames} 帧`)}catch(e){showStatus('连接失败：'+e.message,true)}finally{lock(false)}}
async function refresh(){if(busy)return;lock(true);clearSelection();showStatus('正在扫描服务器配置和 DCP 器件信息，请稍候…');try{const response=await fetch('/api/refresh',{method:'POST',headers:{'X-AMF-Token':config.token}});const result=await response.json();if(!response.ok)throw Error(result.error);install(result)}catch(e){showStatus('刷新失败，已有目录保留：'+e.message,true)}finally{lock(false)}}
device.addEventListener('change',changeDevice);versions.addEventListener('change',selectRun);$('search').addEventListener('input',filterRuns);$('playable').addEventListener('change',filterRuns);$('dcps').addEventListener('change',showDcp);$('load').addEventListener('click',load);$('refresh').addEventListener('click',refresh);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('path').textContent);showStatus('已复制服务器及 DCP 路径。')}catch(e){showStatus('复制失败，请选中上方路径复制。',true)}});
fetch('/api/versions').then(r=>r.json()).then(install).catch(e=>showStatus('目录读取失败：'+e.message,true));
</script></body></html>
